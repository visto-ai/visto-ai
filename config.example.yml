# Deployment configuration. Copy to config.local.yml (git-ignored) and adjust.
# An unknown key anywhere in this file is an error.
# A secret is never written here; it is named by reference: { env: VARIABLE_NAME }.

model:
  # Base URL of the chat-completions endpoint.
  baseUrl: https://openrouter.ai/api/v1
  # The API key, read from this environment variable (sent as a bearer token).
  apiKey: { env: OPENROUTER_API_KEY }
  # The model to ask first.
  model: vendor/model-a
  # Models to try, in order, when the first one fails.
  fallbacks: []
  # Provider fragments merged into the request body for each effort level.
  effort:
    # Used for ordinary pull requests.
    default: {}
    # Used for large pull requests or those that target a primary branch.
    elevated: { reasoning: { effort: high } }
  # Extra fields merged into every request body.
  extraBody: {}
  # Extra headers sent with every request.
  extraHeaders: {}
  # Prices for an endpoint that reports no cost with its answers (OpenRouter does report it), in the currency you write them in.
  # With neither a reported cost nor prices, the cost is 0 and the daily limit cannot see it.
  prices: null
  # prices: { inputPerMillion: 1.0, cachedInputPerMillion: 0.1, outputPerMillion: 4.0 }
  # How long one model call may take, at most 300.
  timeoutSeconds: 240

limits:
  # Input tokens allowed in one model call.
  inputTokensPerCall: 200000
  # Batches of files allowed in one review.
  batchesPerReview: 6
  # The most the service may spend on model calls in one UTC day, in the unit of the recorded costs (US dollars with OpenRouter).
  spendPerDay: 50
  # How many review jobs may run at once (1 to 20).
  queueConcurrency: 2

# true: reviews are run and recorded in the database, and nothing is posted to the git service.
# false: the service posts reviews, and answers /review comments, on real pull requests.
# It is true when not written: the service posts only when this is false.
dryRun: true

# Optional second scorer: a decision model that scores the changed blocks in place of the review model.
# Naming one sends the reviewed code to that provider too, and then
# repositories.defaults.score.threshold must be written below.
# scorer:
#   # Base URL of the scorer's API.
#   baseUrl: https://openrouter.ai/api/alpha
#   # The environment variable that holds the scorer's key.
#   apiKey: { env: SCORER_API_KEY }
#   # The decision model to call.
#   model: vendor/decision-model
#   # Seconds to wait for one scorer call (at most 300).
#   timeoutSeconds: 60

# Needed only to run the service (not for the eval commands).
# app:
#   # The app's id, a whole number from 1 up.
#   id: 12345
#   # The environment variable that holds the app's RSA private key in PEM form.
#   # A key written on one line with backslash-n for each line break is accepted.
#   privateKey: { env: APP_PRIVATE_KEY }
#   # The environment variable that holds the secret set on the app's webhook.
#   webhookSecret: { env: WEBHOOK_SECRET }
# database:
#   # The environment variable that holds the Postgres URL (postgres:// or postgresql://); it contains a password.
#   url: { env: DATABASE_URL }
# server:
#   # The port the service listens on (1 to 65535). It is 8080 when not written.
#   port: 8080
# alerts:
#   # The environment variable that holds the URL (http or https) that gets the alerts: model_error, model_ok, spend_80, spend_limit, cost_unknown and redelivery_failed.
#   webhook: { env: ALERT_WEBHOOK_URL }

repositories:
  # Settings for every repository.
  defaults:
    # Branches that count as primary; a pull request targeting one gets elevated effort.
    primaryBranches: [main, master]
    # Pull requests by these logins are not reviewed. It is [dependabot[bot]] when not written.
    ignoredAuthors: ['dependabot[bot]']
    # Only pull requests that target one of these branches are reviewed; empty means every branch.
    baseBranches: []
    # How a new head of a pull request that already has a review is reviewed.
    #   full:        reads every file again, and costs about what a first review costs.
    #   incremental: reads the files that changed or that no review has read, and the files with a thread due a verdict;
    #                a defect left in code that has not changed is then not found. Not written means incremental.
    # A first review, a head on another base branch and a /review on the last review's head and base ignore it.
    # newHead: incremental
    # A changed block scored at or above this (1 to 100) is listed for a human reviewer.
    # It is 70 when not written, and must be written when a scorer is named.
    # score:
    #   threshold: 70
  # Per-repository changes, keyed by "owner/name"; each replaces only the keys it sets.
  overrides:
    acme/shop: { primaryBranches: [trunk], baseBranches: [trunk], score: { threshold: 60 } }
